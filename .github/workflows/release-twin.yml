name: Release Twin

# A release has no hand-typed version. Its id is derived from the four
# platform binaries it publishes (internal/releaseid): the first 12 hex
# characters of the SHA-256 over their checksum lines. The release is named
# localstack/app-emulator@{name}-{id}, and its tag is twin-{name}-v{id}
# because LocalStack's plugin builds that tag from the pinned version.

on:
  workflow_dispatch:
    inputs:
      twin:
        description: "Twin name (e.g., stripe)"
        required: true
        type: string
      dry_run:
        description: "Build, scan and diff only. Publishes nothing."
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout wondertwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: wondertwin

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: wondertwin/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Install syft
        # Fetch the installer to disk and verify its digest before executing it,
        # rather than piping it straight into a shell. A pipe executes whatever
        # the URL happens to serve at that moment, with no opportunity to detect
        # a compromised or swapped script. Bump SYFT_VERSION and
        # SYFT_INSTALLER_SHA256 together.
        env:
          SYFT_VERSION: v1.44.0
          SYFT_INSTALLER_SHA256: 8a277b4b4dc21809ecd9a0e4926f4d7319affc6451a607fdeb3e5e1fbd9bc573
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            -o "${RUNNER_TEMP}/syft-install.sh"
          echo "${SYFT_INSTALLER_SHA256}  ${RUNNER_TEMP}/syft-install.sh" | sha256sum -c -
          sh "${RUNNER_TEMP}/syft-install.sh" -b /usr/local/bin "${SYFT_VERSION}"
          rm -f "${RUNNER_TEMP}/syft-install.sh"
          syft version

      # The id comes from the binaries, so building comes first. Nothing is
      # tagged or published until the build and the OSV scan have passed, so
      # a failed run leaves no orphan tag behind.
      - name: Build binaries
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
        run: |
          mkdir -p dist
          for platform in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            os="${platform%-*}"
            arch="${platform#*-}"
            echo "Building twin-${TWIN}-${os}-${arch}..."
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags "-s -w" \
              -o "dist/twin-${TWIN}-${os}-${arch}" \
              "./twin-${TWIN}/cmd/twin-${TWIN}/"
          done
          cd dist && shasum -a 256 twin-${TWIN}-* > checksums.txt

      - name: Compute release id
        id: release_id
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
        run: |
          go run ./cmd/release-id --twin "$TWIN" --checksums-file dist/checksums.txt \
            | tee -a "$GITHUB_OUTPUT"

      - name: Summarize the release id
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
          ID: ${{ steps.release_id.outputs.id }}
          DIGEST: ${{ steps.release_id.outputs.digest }}
          COORDINATE: ${{ steps.release_id.outputs.coordinate }}
        run: |
          {
            echo "### ${COORDINATE}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Release id | \`${ID}\` |"
            echo "| Release digest | \`${DIGEST}\` |"
            echo "| Tag | \`twin-${TWIN}-v${ID}\` |"
            echo "| Source commit | \`$(git rev-parse HEAD)\` |"
            echo
            echo "Recompute from the release's checksums.txt:"
            echo
            echo '```'
            echo "grep -E '  twin-${TWIN}-(darwin|linux)-(amd64|arm64)\$' checksums.txt | LC_ALL=C sort -k2 | shasum -a 256 | cut -c1-12"
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the tag and release do not already exist
        working-directory: wondertwin
        env:
          GH_TOKEN: ${{ secrets.WONDERTWIN_REGISTRY }}
          TWIN: ${{ inputs.twin }}
          ID: ${{ steps.release_id.outputs.id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # The id is derived from the binaries, so an existing tag means
          # this exact build is already published. A published release is
          # immutable: fail with a readable message rather than letting the
          # tag push reject opaquely.
          TAG="twin-${TWIN}-v${ID}"
          FOUND=""
          if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            FOUND="tag ${TAG}"
          fi
          if gh release view "$TAG" --repo wondertwin-ai/registry >/dev/null 2>&1; then
            FOUND="${FOUND:+${FOUND} and }release ${TAG}"
          fi
          if [ -n "$FOUND" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::${FOUND} already published; this build is already released and a real run would stop here."
            else
              echo "::error::${FOUND} already published; this build is already released."
              exit 1
            fi
          else
            echo "${TAG} is unpublished; proceeding."
          fi

      - name: Generate SBOM
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
          ID: ${{ steps.release_id.outputs.id }}
        run: |
          # Single canonical SBOM from linux-amd64. See
          # wondertwin-docs/security/policy/maintenance.md for SBOM policy.
          # Its name carries the id, so it is appended to checksums.txt
          # after the id is computed; the id never covers it.
          SBOM="dist/twin-${TWIN}-${ID}.cdx.json"
          syft "dist/twin-${TWIN}-linux-amd64" \
            -o cyclonedx-json="$SBOM" --quiet
          cd dist && shasum -a 256 "twin-${TWIN}-${ID}.cdx.json" >> checksums.txt
          echo "SBOM generated: $SBOM"

      - name: Verify SBOM is OSV-clean
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
          ID: ${{ steps.release_id.outputs.id }}
        run: |
          # Final release gate: a release with known stdlib/dep CVEs in
          # its SBOM fails here, forcing an explicit fix-or-allowlist.
          go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2
          osv-scanner --sbom="dist/twin-${TWIN}-${ID}.cdx.json"

      - name: Create and push twin tag
        if: ${{ !inputs.dry_run }}
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
          ID: ${{ steps.release_id.outputs.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="twin-${TWIN}-v${ID}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create release
        if: ${{ !inputs.dry_run }}
        working-directory: wondertwin
        env:
          GH_TOKEN: ${{ secrets.WONDERTWIN_REGISTRY }}
          TWIN: ${{ inputs.twin }}
          ID: ${{ steps.release_id.outputs.id }}
          DIGEST: ${{ steps.release_id.outputs.digest }}
          COORDINATE: ${{ steps.release_id.outputs.coordinate }}
        run: |
          # The SBOM (twin-<name>-<id>.cdx.json) is already matched by the
          # dist/twin-${TWIN}-* glob; do not list it explicitly or gh will
          # try to upload it twice and 422 on the second attempt.
          {
            echo "${COORDINATE}"
            echo
            echo "- Release id: \`${ID}\`"
            echo "- Release digest: \`${DIGEST}\`"
            echo "- Source commit: \`$(git rev-parse HEAD)\`"
            echo "- SBOM: \`twin-${TWIN}-${ID}.cdx.json\` (CycloneDX JSON)"
            echo
            echo "The id is the first 12 hex characters of the SHA-256 over the four platform binaries' checksum lines. Recompute it from checksums.txt:"
            echo
            echo '```'
            echo "grep -E '  twin-${TWIN}-(darwin|linux)-(amd64|arm64)\$' checksums.txt | LC_ALL=C sort -k2 | shasum -a 256 | cut -c1-12"
            echo '```'
          } > "${RUNNER_TEMP}/release-notes.md"
          gh release create "twin-${TWIN}-v${ID}" \
            dist/twin-${TWIN}-* dist/checksums.txt \
            --repo wondertwin-ai/registry \
            --title "twin-${TWIN} ${ID}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"

      - name: Checkout registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wondertwin-ai/registry
          token: ${{ secrets.WONDERTWIN_REGISTRY }}
          path: registry

      - name: Update registry.json
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
          ID: ${{ steps.release_id.outputs.id }}
          REGISTRY_FILE: ${{ github.workspace }}/registry/registry.json
        run: |
          go run ./cmd/gen-registry \
            --twin "$TWIN" \
            --version "$ID" \
            --checksums-file dist/checksums.txt \
            --registry-file "$REGISTRY_FILE"

      - name: Show the registry.json diff a real run would push
        if: ${{ inputs.dry_run }}
        working-directory: registry
        run: |
          {
            echo "### Dry run: registry.json diff"
            echo
            if git diff --quiet -- registry.json; then
              echo "No change to \`registry.json\`."
            else
              echo '```diff'
              git --no-pager diff -- registry.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push registry update
        if: ${{ !inputs.dry_run }}
        working-directory: registry
        env:
          TWIN: ${{ inputs.twin }}
          ID: ${{ steps.release_id.outputs.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          if git diff --cached --quiet; then
            echo "registry.json unchanged, skipping commit"
          else
            git commit -m "Update registry: twin-${TWIN} ${ID}"
            git push
          fi

      # -- Post-release validation ------------------------------------------
      # Skipped on a dry run: these install the twin from the registry, and
      # a dry run deliberately publishes nothing for them to install.
      - name: Build wt CLI from source
        if: ${{ !inputs.dry_run }}
        working-directory: wondertwin
        run: go build -o ./wt-test ./cmd/wt/

      - name: Clear local twin cache
        if: ${{ !inputs.dry_run }}
        run: rm -rf ~/.wondertwin/bin/

      - name: Install the just-released twin
        if: ${{ !inputs.dry_run }}
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
          ID: ${{ steps.release_id.outputs.id }}
        run: ./wt-test install "${TWIN}@${ID}"

      - name: Run conformance on installed twin
        if: ${{ !inputs.dry_run }}
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
        run: ./wt-test conformance ~/.wondertwin/bin/twin-"${TWIN}"

      # -- Post-validation bookkeeping --------------------------------------
      # Runs last on purpose. Mirroring is bookkeeping, not a release gate,
      # and when it ran before validation a failure here skipped the install
      # and conformance checks entirely. That is how twin-measure shipped
      # unverified on 2026-05-08. The SBOM is read from the workspace, which
      # "Clear local twin cache" does not touch.
      - name: Mirror SBOM to wondertwin-docs
        if: ${{ !inputs.dry_run }}
        env:
          TWIN: ${{ inputs.twin }}
          ID: ${{ steps.release_id.outputs.id }}
          DOCS_TOKEN: ${{ secrets.WONDERTWIN_DOCS_TOKEN }}
        run: |
          if [ -z "$DOCS_TOKEN" ]; then
            echo "::warning::WONDERTWIN_DOCS_TOKEN not set; skipping docs mirror"
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${DOCS_TOKEN}@github.com/WonderTwin-AI/wondertwin-docs.git" \
            docs-mirror
          cd docs-mirror
          mkdir -p "security/sboms/twin-${TWIN}"
          cp "${{ github.workspace }}/wondertwin/dist/twin-${TWIN}-${ID}.cdx.json" \
             "security/sboms/twin-${TWIN}/${ID}.cdx.json"
          cp "${{ github.workspace }}/wondertwin/dist/twin-${TWIN}-${ID}.cdx.json" \
             "security/sboms/twin-${TWIN}/latest.cdx.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "security/sboms/twin-${TWIN}/"
          if git diff --cached --quiet; then
            echo "no SBOM changes, skipping commit"
          else
            git commit -m "sbom: twin-${TWIN} ${ID} (community)"
            git push
          fi
