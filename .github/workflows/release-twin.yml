name: Release Twin

on:
  workflow_dispatch:
    inputs:
      twin:
        description: "Twin name (e.g., stripe)"
        required: true
        type: string
      version:
        description: "Version string without v prefix (e.g., 0.1.0)"
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout wondertwin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          path: wondertwin

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: wondertwin/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Install syft
        # Fetch the installer to disk and verify its digest before executing it,
        # rather than piping it straight into a shell. A pipe executes whatever
        # the URL happens to serve at that moment, with no opportunity to detect
        # a compromised or swapped script. Bump SYFT_VERSION and
        # SYFT_INSTALLER_SHA256 together.
        env:
          SYFT_VERSION: v1.44.0
          SYFT_INSTALLER_SHA256: 8a277b4b4dc21809ecd9a0e4926f4d7319affc6451a607fdeb3e5e1fbd9bc573
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            -o "${RUNNER_TEMP}/syft-install.sh"
          echo "${SYFT_INSTALLER_SHA256}  ${RUNNER_TEMP}/syft-install.sh" | sha256sum -c -
          sh "${RUNNER_TEMP}/syft-install.sh" -b /usr/local/bin "${SYFT_VERSION}"
          rm -f "${RUNNER_TEMP}/syft-install.sh"
          syft version

      - name: Create and push twin tag
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="twin-${TWIN}-v${VERSION}"
          git tag -f "$TAG"
          git push origin -f "$TAG"

      - name: Build binaries
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
        run: |
          mkdir -p dist
          for platform in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            os="${platform%-*}"
            arch="${platform#*-}"
            echo "Building twin-${TWIN}-${os}-${arch}..."
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags "-s -w" \
              -o "dist/twin-${TWIN}-${os}-${arch}" \
              "./twin-${TWIN}/cmd/twin-${TWIN}/"
          done
          cd dist && shasum -a 256 twin-${TWIN}-* > checksums.txt

      - name: Generate SBOM
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
          VERSION: ${{ inputs.version }}
        run: |
          # Single canonical SBOM from linux-amd64. See
          # wondertwin-docs/security/policy/maintenance.md for SBOM policy.
          SBOM="dist/twin-${TWIN}-${VERSION}.cdx.json"
          syft "dist/twin-${TWIN}-linux-amd64" \
            -o cyclonedx-json="$SBOM" --quiet
          cd dist && shasum -a 256 "twin-${TWIN}-${VERSION}.cdx.json" >> checksums.txt
          echo "SBOM generated: $SBOM"

      - name: Verify SBOM is OSV-clean
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
          VERSION: ${{ inputs.version }}
        run: |
          # Final release gate: a release with known stdlib/dep CVEs in
          # its SBOM fails here, forcing an explicit fix-or-allowlist.
          go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2
          osv-scanner --sbom="dist/twin-${TWIN}-${VERSION}.cdx.json"

      - name: Create release
        working-directory: wondertwin
        env:
          GH_TOKEN: ${{ secrets.WONDERTWIN_REGISTRY }}
          TWIN: ${{ inputs.twin }}
          VERSION: ${{ inputs.version }}
        run: |
          # The SBOM (twin-<name>-<version>.cdx.json) is already matched
          # by the dist/twin-${TWIN}-* glob; do not list it explicitly or
          # gh will try to upload it twice and 422 on the second attempt.
          gh release create "twin-${TWIN}-v${VERSION}" \
            dist/twin-${TWIN}-* dist/checksums.txt \
            --repo wondertwin-ai/registry \
            --title "twin-${TWIN} v${VERSION}" \
            --notes "Twin release for ${TWIN} v${VERSION}. SBOM: twin-${TWIN}-${VERSION}.cdx.json (CycloneDX JSON)."

      - name: Checkout registry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: wondertwin-ai/registry
          token: ${{ secrets.WONDERTWIN_REGISTRY }}
          path: registry

      - name: Update registry.json
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
          VERSION: ${{ inputs.version }}
          REGISTRY_FILE: ${{ github.workspace }}/registry/registry.json
        run: |
          go run ./cmd/gen-registry \
            --twin "$TWIN" \
            --version "$VERSION" \
            --checksums-file dist/checksums.txt \
            --registry-file "$REGISTRY_FILE"

      - name: Push registry update
        working-directory: registry
        env:
          TWIN: ${{ inputs.twin }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          if git diff --cached --quiet; then
            echo "registry.json unchanged, skipping commit"
          else
            git commit -m "Update registry: twin-${TWIN} v${VERSION}"
            git push
          fi

      - name: Mirror SBOM to wondertwin-docs
        env:
          TWIN: ${{ inputs.twin }}
          VERSION: ${{ inputs.version }}
          DOCS_TOKEN: ${{ secrets.WONDERTWIN_DOCS_TOKEN }}
        run: |
          if [ -z "$DOCS_TOKEN" ]; then
            echo "::warning::WONDERTWIN_DOCS_TOKEN not set; skipping docs mirror"
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${DOCS_TOKEN}@github.com/WonderTwin-AI/wondertwin-docs.git" \
            docs-mirror
          cd docs-mirror
          mkdir -p "security/sboms/twin-${TWIN}"
          cp "${{ github.workspace }}/wondertwin/dist/twin-${TWIN}-${VERSION}.cdx.json" \
             "security/sboms/twin-${TWIN}/${VERSION}.cdx.json"
          cp "${{ github.workspace }}/wondertwin/dist/twin-${TWIN}-${VERSION}.cdx.json" \
             "security/sboms/twin-${TWIN}/latest.cdx.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "security/sboms/twin-${TWIN}/"
          if git diff --cached --quiet; then
            echo "no SBOM changes, skipping commit"
          else
            git commit -m "sbom: twin-${TWIN} v${VERSION} (community)"
            git push
          fi

      # -- Post-release validation ------------------------------------------
      - name: Build wt CLI from source
        working-directory: wondertwin
        run: go build -o ./wt-test ./cmd/wt/

      - name: Clear local twin cache
        run: rm -rf ~/.wondertwin/bin/

      - name: Install the just-released twin
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
          VERSION: ${{ inputs.version }}
        run: ./wt-test install "${TWIN}@${VERSION}"

      - name: Run conformance on installed twin
        working-directory: wondertwin
        env:
          TWIN: ${{ inputs.twin }}
        run: ./wt-test conformance ~/.wondertwin/bin/twin-"${TWIN}"
