name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - run: go vet ./...
      - run: go test ./... -count=1 -timeout 120s

      - name: Validate twin schemas
        run: go run ./cmd/validate-schemas/

      - name: Validate skill-schema pins
        run: go run ./cmd/validate-skill-pins/

      - name: Validate skill JSON templates
        run: go run ./cmd/validate-skill-templates/

      - name: Build wt CLI
        run: go build ./cmd/wt/

      - name: Build all twins
        run: |
          for twin in stripe twilio resend posthog logodev slack github shopify linear hubspot; do
            echo "Building twin-$twin..."
            go build -o bin/twin-$twin ./twin-$twin/cmd/twin-$twin/
          done

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf # v6.2.1
        with:
          distribution: goreleaser
          # Pinned to v2.15.x: v2.16 turned the brews-section deprecation into a
          # fatal error. The brews -> homebrew_casks migration is a real product
          # change (Formula -> Cask, tap restructure, user migration) and lives
          # in its own dedicated PR, not as a side effect of feature work. Bump
          # this pin when that migration lands.
          version: "~> v2.15"
          args: check

  conformance:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Build wt CLI
        run: go build -o ./wt-test ./cmd/wt/

      - name: Build twin-stripe
        run: go build -o ./twin-stripe-test ./twin-stripe/cmd/twin-stripe/

      - name: Run conformance
        run: ./wt-test conformance ./twin-stripe-test
