name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Deliberately unfiltered. `branches:` on pull_request matches the
    # PR's BASE branch, not its head, so a `[main]` filter gives a stacked
    # PR (one based on another feature branch) zero checks. Keep the
    # filter on push:, where it does mean what it looks like.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - run: go vet ./...
      - run: go test ./... -count=1 -timeout 120s

      - name: Validate twin schemas
        run: go run ./cmd/validate-schemas/

      - name: Enforce tier bright lines
        # Community twins never link commercial code or domain engines
        # (CTO-45 / CTO-50). Structural check: the declared tier plus the
        # actual dependency graph via go list, not a source grep.
        run: |
          set -euo pipefail
          forbidden='github.com/wondertwin-ai/wondertwin-pro/|github.com/wondertwin-ai/wondertwin/twinkit/(contract|ledger|workspace|messaging|search|events)(/|$)'
          for dir in twin-*/; do
            twin="${dir%/}"
            tier=$(jq -r .tier "$twin/twin-manifest.json")
            if [ "$tier" != "community" ]; then
              echo "::error::$twin declares tier '$tier'; every twin in this repo must be community"
              exit 1
            fi
            if deps=$(go list -deps "./$twin/..." | grep -E "$forbidden"); then
              echo "::error::$twin links forbidden packages:"
              echo "$deps"
              exit 1
            fi
          done
          echo "Tier bright lines hold for all twins"

      - name: Validate skill-schema pins
        run: go run ./cmd/validate-skill-pins/

      - name: Validate skill JSON templates
        run: go run ./cmd/validate-skill-templates/

      - name: Build wt CLI
        run: go build ./cmd/wt/

      - name: Build all twins
        run: |
          for twin in stripe twilio resend posthog logodev slack github shopify linear hubspot; do
            echo "Building twin-$twin..."
            go build -o bin/twin-$twin ./twin-$twin/cmd/twin-$twin/
          done

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v6.2.1
        with:
          distribution: goreleaser
          # Pinned to v2.15.x: v2.16 turned the brews-section deprecation into a
          # fatal error. The brews -> homebrew_casks migration is a real product
          # change (Formula -> Cask, tap restructure, user migration) and lives
          # in its own dedicated PR, not as a side effect of feature work. Bump
          # this pin when that migration lands.
          version: "~> v2.15"
          args: check

  conformance:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Build wt CLI
        run: go build -o ./wt-test ./cmd/wt/

      - name: Build twin-stripe
        run: go build -o ./twin-stripe-test ./twin-stripe/cmd/twin-stripe/

      - name: Run conformance
        run: ./wt-test conformance ./twin-stripe-test
