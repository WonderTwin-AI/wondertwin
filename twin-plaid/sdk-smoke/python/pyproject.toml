[project]
name = "twin-plaid-sdk-smoke-python"
version = "0.0.0"
description = "Runs the Plaid app emulator's use cases through the official plaid-python SDK."
requires-python = ">=3.10"
dependencies = ["plaid-python==44.0.0"]

[tool.uv]
package = false
exclude-newer = "7 days"
# certifi is held to the newest release so a published CVE fix is never delayed by the 7 day window.
exclude-newer-package = { certifi = "0 days" }
