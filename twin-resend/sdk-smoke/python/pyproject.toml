[project]
name = "twin-resend-sdk-smoke-python"
version = "0.0.0"
description = "Runs the Resend app emulator's email flows through the official resend-python SDK."
requires-python = ">=3.10"
dependencies = ["resend==2.48.0"]

[tool.uv]
package = false
exclude-newer = "7 days"
# certifi is held to the newest release so a published CVE fix is never delayed by the 7 day window.
exclude-newer-package = { certifi = "0 days" }
